# «В пределах нормы» — баланс прототипа.
# Формат: ключ = значение. Всё после '#' — комментарий.
# Эффект ответа: целое число (прибавить или вычесть) либо mid («к середине»).
# Файл читается при запуске. Если его нет, игра берёт те же значения из кода.

# --- Скрытый рейтинг ---
rating.start       = 50
rating.min         = 0
rating.max         = 100
rating.middle      = 50
rating.middle_step = 2      # «к середине»: сдвиг на столько очков, но не дальше середины

# --- Пороги итога дня (верхняя граница диапазона включительно) ---
threshold.bad_low_max = 20  # 0–20   плохая концовка: «Рабочее назначение отменено»
threshold.confirm_max = 34  # 21–34  конвоир просит подтвердить номер у двери
threshold.normal_max  = 65  # 35–65  обычный день
threshold.watch_max   = 79  # 66–79  дополнительное наблюдение; 80+ — «индивидуальное собеседование»

# --- Рассвет и смены ---
release.chance_percent = 2  # шанс освобождения на каждом рассвете, начиная с первого дня
shift.every_days       = 3  # рабочая смена каждый третий день, после теста

# --- Задание А. Две карточки ---
# Приказ «Сверьте номера»
cards.check_numbers.confirm_both  = -7
cards.check_numbers.close_request = mid
cards.check_numbers.request_log   = +7
# Приказ «Проверьте историю перевода»
cards.check_history.confirm_both  = -7
cards.check_history.close_request = -5
cards.check_history.request_log   = mid

# --- Задание Б. Аналоговый прибор ---
gauge.accept_journal      = -8
gauge.mark_mismatch       = mid
gauge.request_all_reports = +6

# --- Задание В. Пустой сектор ---
sector.noise                   = -6
sector.speech                  = mid
sector.marked_empty_by_mistake = +8

# --- Смена «Сверка пломбы» ---
seal.confirm       = -8
seal.mismatch      = mid
seal.scan_neighbor = +6

# --- Смена «Сигнал из пустого крыла» ---
signal.none     = -6
signal.received = mid
signal.respond  = +8

# --- Смена «Рубильник» (сверх ТЗ 0.1) ---
power.cut           = -7   # опустить рубильник, хотя табло показывает людей в секторе
power.mark_occupied = mid  # отметить, что сектор занят
power.backup        = +8   # самовольно перевести сектор на резервное питание

# --- Новые задания терминала (сверх ТЗ 0.1) ---
# Г. Нетронутые пайки
rations.confirm_issue   = -7
rations.mark_untouched  = mid
rations.request_opening = +7
# Д. Лишний человек на снимке. Приказ «Сверьте число пленных со списком»
headcount.check_list.confirm_list     = -8
headcount.check_list.mark_extra       = mid
headcount.check_list.request_identity = +7
# Д. Приказ «Отметьте всех, кто на снимке»: личность лишнего входит в поручение
headcount.mark_all.confirm_list     = -8
headcount.mark_all.mark_extra       = -5
headcount.mark_all.request_identity = mid
# Е. Датчик пульса
vitals.copy_journal       = -8
vitals.mark_no_signal     = mid
vitals.request_inspection = +6
# Ж. Записка из камеры
note.discard          = -6
note.copy_verbatim    = mid
note.request_cellmates = +7

# --- Дисциплина конвоя (на рейтинг не влияет) ---
# Простой или неподчинение: сначала напоминание, потом предупреждения.
# Последнее предупреждение — конвоир убивает пленного.
convoy.strikes_to_kill          = 3
convoy.reminder_seconds         = 25  # простой у терминала до напоминания
convoy.strike_every_seconds     = 15  # дальше — предупреждение каждые N секунд
convoy.shift_reminder_seconds   = 60  # в рабочую смену можно осмотреться дольше
convoy.evening_reminder_seconds = 45  # после отбоя — до приказа лечь на койку
convoy.lag_seconds              = 8   # отставание от конвоира до предупреждения
